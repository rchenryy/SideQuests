<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ user.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>

</style>
</head>
<body>
    <h1>you are in the user page !</h1>
    <a href="{{url_for('main')}}">main page</a>
    <body>
<main class="profile">
  <h1>{{ user.name }}</h1>
  <p class="email">{{ user.email }}</p>
 
  <dl>
    <dt>Class year</dt><dd>{{ user.class }}</dd>
    <dt>Date of birth</dt><dd>{{ user.dob }}</dd>
  </dl>
 
  <p class="bio">{{ user.bio or "No bio yet." }}</p>

  <a class="edit" href="">Edit profile</a> 
</main>
