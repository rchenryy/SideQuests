<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>New user</title>
        <!-- <link rel="stylesheet" href="style.css"> -->
        <style>
        </style>
    </head>

    <body>
        <a href="/">Back to login page</a>
        <form action="{{url_for('new_user')}}" method="post">
            <h1>Create your account</h1>
            <br>
            <br>

            <label>Name <input name="name" type="text" maxlength="30" autocomplete="name" value="{{user.name}}" required> </label>
            <br>
            <br>
            
            {% if message %}<div class="message"><p>{{message}}</p></div>{% endif %}
            <label>Wellesley Username <input name="email" type="text" maxlength="5" value="{{user.email}}" required> </label>
            <br>
            <br>
            
            <label>Password <input name="password" type="text" maxlength="30" value="{{user.password}}" required> </label>
            <br>
            <br>

            <div class="row">
                <label>Class year 
                    <select name="class" required>
                        {% if user['class'] == '' %}
                            <option value="" disabled selected>Select</option>
                        {% else %}
                            <option value="{{ user['class'] }}" selected>{{ user['class'] }}</option>
                        {% endif %}
                    </select>                </label>
                <label>Date of birth <input name="dob" type="date" autocomplete="bday" value="{{user.dob}}" required> </label>
            </div>
            <br>
            <br>

            <label>Bio
            <textarea name="bio" maxlength="250">{{user.bio}}</textarea>
            </label> 
            <button type="submit">Create account</button>
        </form>

        <script>
  const sel = document.querySelector('[name=class]');
  const y = new Date().getFullYear();
  for (let i = y - 5; i <= y + 6; i++) sel.add(new Option(i, i));
  document.querySelector('[name=dob]').max = new Date().toISOString().split('T')[0];
        </script>
    </body>
</html>
