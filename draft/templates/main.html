<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { display: block; padding: 0; }
  header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; padding: 1rem 1.5rem;
    background: var(--surface); border-bottom: 1px solid var(--border); }
  .btn { padding: .55rem 1rem; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
    color: var(--accent-text); background: var(--accent); border: 0; border-radius: 6px; white-space: nowrap; }
  .search { flex: 1; display: flex; gap: .5rem; min-width: 14rem; }
  .search input, .search select { margin: 0; padding: .55rem .65rem; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .search input { flex: 1; min-width: 0; }
  .btn:focus-visible, .search *:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
  .card { display: block; padding: 1.25rem; color: inherit; text-decoration: none; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; }
  .card:hover { border-color: var(--accent); }
  .card h2 { margin: 0 0 .4rem; font-size: 1.1rem; }
  .card p { margin: 0; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <a class="btn" href="{{ url_for('new_event') }}">+ Add Event</a>

  <form class="search" method="get" action="{{ url_for('main') }}" role="search">
    <input type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="Search" aria-label="Search">
    <button class="btn" type="submit">Search</button>
  </form>

  <a class="btn" href="{{url_for('user')}}">My profile</a>
</header>

<main>
    <a href="{{url_for('event')}}">event page sample</a>
  {% if items %}
    <div class="grid">
      {% for item in users %}
        <a class="card" href="">
          <h2>{{ item.name }}</h2>
          <p>{{ item.email }}</p>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <p class="empty">No items found.</p>
  {% endif %}
</main>
</body>
</html>
